name: automation-ruff-format-36672

on:
  push:
    branches:
      - automation/ruff-format-36672

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/ruff-format-36672
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff==0.15.3
      - name: Format target source
        run: ruff format litellm/router_utils/fallback_event_handlers.py
      - name: Commit formatted source
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add litellm/router_utils/fallback_event_handlers.py
          git commit -m "chore: format fallback event handlers with ruff 0.15.3"
          git push origin HEAD:automation/ruff-format-36672
